<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - BO3 Modding Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <h2>Create Account</h2>

        <div id="message" class="auth-message" style="display:none;"></div>

        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="confirm" placeholder="Confirm Password" required>

            <button type="submit">Register</button>
        </form>

        <div class="auth-links">
            <a href="login.html">Already have an account?</a>
        </div>
    </div>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const confirm = document.getElementById("confirm").value.trim();

    const msg = document.getElementById("message");

    if (password !== confirm) {
        msg.className = "auth-message auth-error";
        msg.innerText = "Passwords do not match.";
        msg.style.display = "block";
        return;
    }

    const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password })
    });

    const data = await res.json();

    if (data.success) {
        msg.className = "auth-message auth-success";
        msg.innerText = "Account created! Redirecting...";
        msg.style.display = "block";
        setTimeout(() => window.location.href = "login.html", 800);
    } else {
        msg.className = "auth-message auth-error";
        msg.innerText = data.message || "Registration failed.";
        msg.style.display = "block";
    }
});
</script>
<script>
    async function updateNavbar() {
        const res = await fetch("/account");
        const data = await res.json();
    
        const nav = document.getElementById("dynamic-nav");
    
        if (!nav) return;
    
        if (data.loggedIn) {
            nav.innerHTML = `
                <a href="account.html">Account</a>
                <a href="#" id="logoutLink">Logout</a>
            `;
    
            document.getElementById("logoutLink").addEventListener("click", async () => {
                await fetch("/logout", { method: "POST" });
                window.location.href = "login.html";
            });
    
        } else {
            nav.innerHTML = `
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            `;
        }
    }
    
    updateNavbar();
    </script>
    
</body>
</html>
